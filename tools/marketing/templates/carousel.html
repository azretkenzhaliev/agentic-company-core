<!doctype html>
<!-- Carousel slide, 1080x1350 (4:5). Copy per slide; edit the text and the :root brand colours (brand book). -->
<html lang="en"><head><meta charset="utf-8">
<style>
  :root { --bg: #0f1014; --fg: #f4f2ec; --accent: #7cf29c; --muted: #9a9890; }
  body { width: 1080px; height: 1350px; box-sizing: border-box; padding: 96px 88px; display: flex; flex-direction: column; }
  .kicker { font: 700 30px 'Golos Text', sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  h1 { font-weight: 800; font-size: 92px; margin-top: 36px; }
  .body { font-size: 44px; margin-top: 48px; color: var(--fg); }
  .body p + p { margin-top: 28px; }
  .footer { margin-top: auto; display: flex; justify-content: space-between; font: 600 28px 'Golos Text', sans-serif; color: var(--muted); }
</style></head>
<body>
  <div class="kicker">Series</div>
  <h1>One claim, said in one line</h1>
  <div class="body">
    <p>The main language comes first.</p>
    <p>The second language, where the brand has one, is the second block.</p>
  </div>
  <div class="footer"><span>@handle</span><span>1 / 5</span></div>
</body></html>
