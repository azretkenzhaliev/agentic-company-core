<!doctype html>
<!-- Story frame, 1080x1920 (9:16). Keep text out of the top 250 px and the bottom 340 px: Instagram's UI covers them. -->
<html lang="en"><head><meta charset="utf-8">
<style>
  :root { --bg: #0f1014; --fg: #f4f2ec; --accent: #7cf29c; }
  body { width: 1080px; height: 1920px; box-sizing: border-box; padding: 250px 88px 340px; display: flex; flex-direction: column; justify-content: center; }
  .step { font: 700 34px 'Golos Text', sans-serif; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }
  h1 { font-weight: 800; font-size: 104px; margin-top: 32px; }
  p { font-size: 50px; margin-top: 40px; }
  .sticker-slot { margin-top: 64px; height: 220px; border: 4px dashed var(--accent); border-radius: 32px; display: flex; align-items: center; justify-content: center; font: 600 32px 'Golos Text', sans-serif; color: var(--accent); }
</style></head>
<body>
  <div class="step">1 / 4</div>
  <h1>What changed today?</h1>
  <p>One short line.</p>
  <div class="sticker-slot">Founder adds the poll sticker here</div>
</body></html>
